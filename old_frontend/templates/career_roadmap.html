<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Roadmap</title>

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #e3f2fd, #f5f7fa);
    padding: 40px;
}

/* Main Card */
.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
    animation: fadeIn 0.6s ease-in-out;
}

/* Title */
.main-title {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 30px;
}

/* Section Headings */
h2 {
    margin-top: 35px;
    padding: 12px 15px;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    font-size: 20px;
}

h3 {
    margin-top: 20px;
    color: #1e3a8a;
}

/* Paragraphs */
p {
    font-size: 15px;
    line-height: 1.7;
    color: #333;
}

/* Lists */
ul {
    margin-top: 10px;
    padding-left: 20px;
}

li {
    margin-bottom: 8px;
}

/* Highlight Box */
.highlight-box {
    background: #f0f9ff;
    padding: 20px;
    border-left: 5px solid #2563eb;
    border-radius: 8px;
    margin-top: 15px;
}

/* Roadmap Cards */
.roadmap-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.roadmap-card {
    background: #f8fafc;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    transition: 0.3s;
}

.roadmap-card:hover {
    transform: translateY(-5px);
}

/* Career Cards */
.career-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-top: 15px;
}

.career-card {
    background: #eef2ff;
    padding: 15px;
    border-radius: 8px;
    font-size: 14px;
    transition: 0.3s;
}

.career-card:hover {
    background: #dbeafe;
}

/* Buttons */
.button-group {
    text-align: center;
    margin-top: 40px;
}

.btn {
    display: inline-block;
    padding: 12px 25px;
    margin: 10px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {
    background: #6b7280;
    color: white;
}

.btn-secondary:hover {
    background: #4b5563;
}

/* Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

</style>
</head>

<body>

<div class="container">

    <div class="main-title">
        Your Personalized Career Roadmap
    </div>

    <!-- LLM Generated Content -->
    <div class="llm-content">
        {{ response | safe }}
    </div>

    <div class="button-group">
        <!-- <a href="/retake_assessment" class="btn btn-secondary">Retake Assessment</a> -->
        <a href="/logout" class="btn btn-primary">Logout</a>
    </div>

</div>

</body>
</html>
