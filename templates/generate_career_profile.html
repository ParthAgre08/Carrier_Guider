<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Recommendation</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-2xl">

    <h1 class="text-2xl font-bold text-center mb-6">
        Career Stream Recommendation
    </h1>

    <!-- Best Stream -->
    <div class="text-center mb-6">
        <h2 class="text-xl font-semibold">
            Best Stream: 
            <span class="text-blue-600">{{ best_stream }}</span>
        </h2>

        <p class="mt-2">
            Confidence Level: 
            <b>{{ confidence_level }}</b>
        </p>
    </div>

    <!-- Scores -->
    <h3 class="font-bold mb-3">Stream Scores</h3>

    {% for stream, score in scores.items() %}
        <p>
            {{ stream }} :
            {{ (score * 100) | round(2) }}%
        </p>
    {% endfor %}

    <!-- Buttons -->
    <div class="text-center mt-6">

        <a href="{{ url_for('career_roadmap') }}"
           class="bg-blue-500 text-white px-5 py-2 rounded">
            Yes I agree with Suggestion 
        </a>

        <a href="{{ url_for('retake_assessment') }}"
           class="bg-gray-400 text-white px-5 py-2 rounded ml-3">
            I Dont Agree with suggestion
        </a>

    </div>

</div>

</body>
</html>
