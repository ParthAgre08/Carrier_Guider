<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Career Guider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .hero-gradient {
            background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.1), transparent),
                        radial-gradient(circle at bottom left, rgba(99, 102, 241, 0.1), transparent);
        }
        .text-gradient {
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 hero-gradient min-h-screen font-sans flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2 mb-4">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-lg overflow-hidden shrink-0">
                    <i class="fas fa-compass fa-lg"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight text-gradient">Career Guider</span>
            </a>
            <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Welcome Back</h2>
            <p class="text-slate-600">Sign in to continue your career journey</p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-xl shadow-blue-900/5 p-8 border border-slate-100 backdrop-blur-sm transition-all duration-300 hover:shadow-2xl hover:shadow-blue-900/10">
            <form action="/login" method="post" class="space-y-6">
                {% if error %}
                <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center font-medium border border-red-100">
                    {{ error }}
                </div>
                {% endif %}

                <div class="space-y-2">
                    <label for="exampleInputEmail1" class="text-sm font-semibold text-slate-700 block">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-slate-400"></i>
                        </div>
                        <input type="email" id="exampleInputEmail1" name="email" class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600/50 focus:border-blue-600 transition-colors" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="exampleInputPassword1" class="text-sm font-semibold text-slate-700 block">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" id="exampleInputPassword1" name="password" class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600/50 focus:border-blue-600 transition-colors" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all hover:shadow-lg shadow-blue-200 flex items-center justify-center gap-2 group">
                    Sign In <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-slate-600">
                Don't have an account? <a href="/register" class="text-blue-600 font-semibold hover:text-blue-700 hover:underline transition-colors">Register here</a>
            </div>
        </div>
    </div>

</body>
</html>
