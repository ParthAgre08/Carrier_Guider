<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interest Assessment</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
function updateValue(slider, outputId) {
    document.getElementById(outputId).innerText = slider.value;
}
</script>

<style>

/* ===== Background Override ===== */
body {
    background: linear-gradient(135deg, #ffffff 0%, #f2f7ff 50%, #e6f0ff 100%) !important;
}

/* ===== Main Card ===== */
body > div {
    background: #ffffff !important;
    border-radius: 28px !important;
    border: 1px solid rgba(0, 90, 255, 0.2);
    box-shadow: 
        0 25px 70px rgba(0, 60, 255, 0.12),
        0 0 35px rgba(0, 90, 255, 0.08);
    transition: 0.3s ease;
    animation: fadeUp 0.8s ease-in-out;
}

body > div:hover {
    box-shadow: 
        0 30px 80px rgba(0, 60, 255, 0.18),
        0 0 45px rgba(0, 90, 255, 0.15);
}

/* ===== Main Heading ===== */
h1 {
    background: linear-gradient(90deg, #0033cc, #1a75ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700 !important;
}

/* ===== Section Headings ===== */
h2 {
    color: #1a2a6c !important;
    font-weight: 700 !important;
}

/* ===== Description Text ===== */
p {
    color: #4a5c9a !important;
}

/* ===== Labels ===== */
label {
    color: #1a2a6c !important;
}

/* ===== Slider Styling ===== */
input[type="range"] {
    -webkit-appearance: none;
    height: 8px;
    border-radius: 10px;
    background: linear-gradient(90deg, #0033cc, #1a75ff);
    outline: none;
}

/* Slider Thumb */
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: white;
    border: 3px solid #1a4dff;
    cursor: pointer;
    transition: 0.3s ease;
}

input[type="range"]::-webkit-slider-thumb:hover {
    box-shadow: 0 0 15px rgba(0, 85, 255, 0.6);
    transform: scale(1.1);
}

/* Firefox */
input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: white;
    border: 3px solid #1a4dff;
    cursor: pointer;
}

/* ===== Value Numbers ===== */
span {
    color: #1a4dff !important;
    font-size: 18px;
}

/* ===== Submit Button ===== */
button[type="submit"] {
    background: linear-gradient(90deg, #0033cc, #1a75ff) !important;
    border-radius: 30px !important;
    padding: 14px 40px !important;
    font-weight: 700 !important;
    transition: 0.3s ease !important;
}

button[type="submit"]:hover {
    box-shadow: 0 0 25px rgba(0, 85, 255, 0.6) !important;
    transform: translateY(-3px);
}

/* ===== Animation ===== */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>

</head>

<body class="bg-gradient-to-br from-blue-600 to-green-500 min-h-screen flex justify-center items-center">

<div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-4xl">

<h1 class="text-3xl font-bold text-center mb-2">
Interest & Personality Assessment
</h1>

<p class="text-center text-gray-600 mb-6">
Rate each statement from <b>1 (Not at all)</b> to <b>5 (Very much)</b>
</p>

<form method="POST" action="/interest_assessment">

<!-- SECTION 1 -->
<h2 class="text-xl font-bold mb-4">1️⃣ Subject Enjoyment</h2>

<div class="space-y-6">

<!-- Maths -->
<div>
<label class="font-medium">
I enjoy solving Mathematics problems.
</label>

<div class="flex items-center gap-4">
<input type="range" name="interest_math" min="1" max="5" value="3"
oninput="updateValue(this,'math_val')" class="w-full">
<span id="math_val" class="font-bold text-blue-600">3</span>
</div>
</div>

<!-- Science -->
<div>
<label class="font-medium">
I like studying Science and experiments.
</label>

<div class="flex items-center gap-4">
<input type="range" name="interest_science" min="1" max="5" value="3"
oninput="updateValue(this,'science_val')" class="w-full">
<span id="science_val" class="font-bold text-blue-600">3</span>
</div>
</div>

<!-- Business -->
<div>
<label class="font-medium">
I enjoy Business and money-related topics.
</label>

<div class="flex items-center gap-4">
<input type="range" name="interest_business" min="1" max="5" value="3"
oninput="updateValue(this,'business_val')" class="w-full">
<span id="business_val" class="font-bold text-blue-600">3</span>
</div>
</div>

<!-- Creative -->
<div>
<label class="font-medium">
I enjoy creative subjects like drawing or writing.
</label>

<div class="flex items-center gap-4">
<input type="range" name="interest_creative" min="1" max="5" value="3"
oninput="updateValue(this,'creative_val')" class="w-full">
<span id="creative_val" class="font-bold text-blue-600">3</span>
</div>
</div>

<!-- Social -->
<div>
<label class="font-medium">
I like Social Studies and understanding society.
</label>

<div class="flex items-center gap-4">
<input type="range" name="interest_social" min="1" max="5" value="3"
oninput="updateValue(this,'social_val')" class="w-full">
<span id="social_val" class="font-bold text-blue-600">3</span>
</div>
</div>

</div>

<!-- SUBMIT -->
<div class="text-center mt-8">
<button type="submit"
class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-800 font-bold text-lg">
Generate My Career Profile
</button>
</div>

</form>

</div>

</body>
</html>
