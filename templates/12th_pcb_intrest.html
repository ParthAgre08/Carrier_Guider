<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12th PCB Interest Assessment</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
function updateValue(slider, outputId) {
    document.getElementById(outputId).innerText = slider.value;
}
</script>

</head>

<body class="bg-gradient-to-br from-green-600 to-teal-700 min-h-screen flex justify-center items-center p-6">

<div class="bg-white shadow-2xl rounded-2xl p-10 w-full max-w-4xl">

<h1 class="text-3xl font-bold text-center text-gray-800 mb-2">
12th Science (PCB) Interest Assessment
</h1>

<p class="text-center text-gray-600 mb-8">
Rate each statement from <b>1 (Very Low)</b> to <b>5 (Very High)</b>
</p>

<form method="POST" action="/interest_assessment" class="space-y-8">

<h2 class="text-xl font-semibold text-green-700 border-b pb-2">
Career & Domain Interests
</h2>

<!-- Medical -->
<div>
<label class="block font-medium mb-2">
I am strongly interested in becoming a Doctor (MBBS/BDS).
</label>
<div class="flex items-center gap-4">
<input type="range" name="interest_medical" min="1" max="5" value="3"
oninput="updateValue(this,'medical_val')" class="w-full accent-green-600" required>
<span id="medical_val" class="font-bold text-green-600 text-lg">3</span>
</div>
</div>

<!-- Research -->
<div>
<label class="block font-medium mb-2">
I am interested in Biological Research or Biotechnology.
</label>
<div class="flex items-center gap-4">
<input type="range" name="interest_research" min="1" max="5" value="3"
oninput="updateValue(this,'research_val')" class="w-full accent-green-600" required>
<span id="research_val" class="font-bold text-green-600 text-lg">3</span>
</div>
</div>

<!-- Pharmacy -->
<div>
<label class="block font-medium mb-2">
I am interested in Pharmacy or Drug Development.
</label>
<div class="flex items-center gap-4">
<input type="range" name="interest_pharma" min="1" max="5" value="3"
oninput="updateValue(this,'pharma_val')" class="w-full accent-green-600" required>
<span id="pharma_val" class="font-bold text-green-600 text-lg">3</span>
</div>
</div>

<!-- Allied Health -->
<div>
<label class="block font-medium mb-2">
I am interested in Allied Health Sciences (Physiotherapy, Nursing, Lab Tech).
</label>
<div class="flex items-center gap-4">
<input type="range" name="interest_allied" min="1" max="5" value="3"
oninput="updateValue(this,'allied_val')" class="w-full accent-green-600" required>
<span id="allied_val" class="font-bold text-green-600 text-lg">3</span>
</div>
</div>

<!-- Psychology -->
<div>
<label class="block font-medium mb-2">
I am interested in Psychology and understanding human behavior.
</label>
<div class="flex items-center gap-4">
<input type="range" name="interest_psychology" min="1" max="5" value="3"
oninput="updateValue(this,'psych_val')" class="w-full accent-green-600" required>
<span id="psych_val" class="font-bold text-green-600 text-lg">3</span>
</div>
</div>

<!-- Environmental -->
<div>
<label class="block font-medium mb-2">
I am interested in Environmental Science and sustainability.
</label>
<div class="flex items-center gap-4">
<input type="range" name="interest_environment" min="1" max="5" value="3"
oninput="updateValue(this,'env_val')" class="w-full accent-green-600" required>
<span id="env_val" class="font-bold text-green-600 text-lg">3</span>
</div>
</div>

<!-- SUBMIT -->
<div class="text-center pt-6">
<button type="submit"
class="bg-green-600 text-white px-10 py-3 rounded-lg hover:bg-green-800 font-bold text-lg transition">
Generate My Career Profile
</button>
</div>

</form>

</div>

</body>
</html>
