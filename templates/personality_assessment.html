<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg:       #e8ecf8;
    --accent:   #2563eb;
    --accent-d: #1d4ed8;
    --navy:     #0c1340;
    --body:     #3a4166;
    --muted:    #6b7aab;
    --border:   rgba(37,99,235,0.14);
    --soft:     rgba(37,99,235,0.07);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--navy);
    min-height: 100vh;
    overflow-x: hidden;
}

/* ── background layers ── */
body::before {
    content:'';
    position:fixed; inset:0;
    pointer-events:none; z-index:0;
    background-image: radial-gradient(circle, rgba(37,99,235,0.11) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(ellipse 85% 70% at 50% 30%, black 20%, transparent 100%);
}
body::after {
    content:'';
    position:fixed; inset:0;
    pointer-events:none; z-index:0;
    background:
        radial-gradient(ellipse 60% 50% at 10% 0%,  rgba(37,99,235,0.08), transparent),
        radial-gradient(ellipse 50% 40% at 90% 90%, rgba(99,102,241,0.07), transparent);
}

/* ── nav ── */
nav {
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 2rem; height:58px;
    background:rgba(232,236,248,0.82);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
}
.nav-logo {
    display:flex; align-items:center; gap:9px;
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800; font-size:1.1rem;
    color:var(--navy); text-decoration:none;
}
.nav-icon {
    width:32px; height:32px; border-radius:9px;
    background:var(--accent);
    display:grid; place-items:center;
    color:white; font-size:13px;
}
.nav-back {
    font-size:.82rem; font-weight:500; color:var(--muted);
    text-decoration:none; padding:6px 14px;
    border-radius:99px; border:1px solid var(--border);
    background:rgba(255,255,255,.5); transition:.2s;
}
.nav-back:hover { color:var(--accent); background:white; }

/* ── wrapper ── */
.page {
    position:relative; z-index:1;
    max-width:740px; margin:0 auto;
    padding:2.5rem 1.25rem 5rem;
}

/* ── top header ── */
.quiz-header { text-align:center; margin-bottom:2rem; animation:fadeUp .6s ease both; }
.quiz-eyebrow {
    display:inline-flex; align-items:center; gap:7px;
    font-size:.7rem; font-weight:600; letter-spacing:.1em;
    text-transform:uppercase; color:var(--accent);
    background:rgba(37,99,235,.10); border:1px solid rgba(37,99,235,.18);
    padding:5px 13px; border-radius:99px; margin-bottom:.9rem;
}
.pulse { width:6px; height:6px; background:var(--accent); border-radius:50%; animation:pulse 2s infinite; }
.quiz-header h1 {
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:clamp(1.7rem,4vw,2.4rem); font-weight:800;
    color:var(--navy); letter-spacing:-.02em; margin-bottom:.5rem;
}
.quiz-header p { font-size:.93rem; color:var(--muted); }

/* ── progress bar ── */
.progress-wrap { margin-bottom:2rem; animation:fadeUp .6s .1s ease both; }
.progress-meta {
    display:flex; justify-content:space-between;
    font-size:.78rem; font-weight:600; color:var(--muted);
    margin-bottom:.5rem;
}
.progress-track {
    height:6px; background:rgba(37,99,235,.12);
    border-radius:99px; overflow:hidden;
}
.progress-fill {
    height:100%;
    background:linear-gradient(90deg, var(--accent), #6366f1);
    border-radius:99px;
    transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ── section card ── */
.section-card {
    background:white; border:1px solid var(--border);
    border-radius:20px; overflow:hidden;
    animation:fadeUp .5s ease both;
}
.section-header {
    display:flex; align-items:center; gap:12px;
    padding:1.4rem 1.6rem;
    background:var(--soft); border-bottom:1px solid var(--border);
}
.section-number {
    width:36px; height:36px; border-radius:10px;
    background:var(--accent); color:white;
    display:grid; place-items:center;
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800; font-size:.95rem; flex-shrink:0;
}
.section-info h2 {
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:1.05rem; font-weight:700; color:var(--navy);
}
.section-info p { font-size:.78rem; color:var(--muted); margin-top:1px; }
.section-badge {
    margin-left:auto; font-size:.68rem; font-weight:600;
    letter-spacing:.07em; text-transform:uppercase;
    color:var(--accent); background:rgba(37,99,235,.10);
    padding:4px 10px; border-radius:99px; white-space:nowrap;
}

/* ── questions inside section ── */
.questions-body { padding:1.2rem 1.4rem; }

.question-item {
    padding:1rem 0;
    border-bottom:1px solid rgba(37,99,235,.07);
}
.question-item:last-child { border-bottom:none; }

.question-text {
    font-size:.9rem; font-weight:600; color:var(--navy);
    margin-bottom:.85rem; line-height:1.5;
}
.question-num {
    font-size:.72rem; font-weight:700; color:var(--accent);
    margin-bottom:.3rem; text-transform:uppercase; letter-spacing:.06em;
}

/* ── answer options as interactive cards ── */
.options-row {
    display:flex; flex-wrap:wrap; gap:.45rem;
}

.opt-btn {
    position:relative; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    padding:.45rem .85rem;
    border:1.5px solid var(--border);
    border-radius:99px; background:white;
    font-size:.8rem; font-weight:500; color:var(--body);
    transition:all .18s ease;
    user-select:none;
}
.opt-btn:hover {
    border-color:var(--accent);
    background:rgba(37,99,235,.05);
    color:var(--accent);
    transform:translateY(-1px);
}
.opt-btn.selected {
    border-color:var(--accent);
    background:var(--accent);
    color:white;
    box-shadow:0 4px 14px rgba(37,99,235,.28);
    transform:translateY(-2px);
}
.opt-btn .dot {
    width:7px; height:7px; border-radius:50%;
    background:currentColor; opacity:.55; flex-shrink:0;
    transition:.15s;
}
.opt-btn.selected .dot { opacity:1; }



/* the hidden real radio that gets submitted */
input[type="radio"] { display:none !important; }

/* ── nav buttons row ── */
.nav-buttons {
    display:flex; justify-content:space-between; align-items:center;
    margin-top:1.6rem; gap:1rem;
}
.btn-prev, .btn-next, .btn-submit {
    display:inline-flex; align-items:center; gap:7px;
    padding:.65rem 1.5rem; border-radius:99px;
    font-size:.85rem; font-weight:600; cursor:pointer;
    border:none; transition:.2s; font-family:'DM Sans',sans-serif;
}
.btn-prev {
    background:white; color:var(--body);
    border:1.5px solid var(--border);
}
.btn-prev:hover { border-color:var(--accent); color:var(--accent); }
.btn-next {
    background:var(--accent); color:white; margin-left:auto;
    box-shadow:0 6px 20px rgba(37,99,235,.25);
}
.btn-next:hover { background:var(--accent-d); transform:translateY(-1px); }
.btn-submit {
    background:linear-gradient(135deg, var(--accent), #6366f1);
    color:white; margin-left:auto;
    box-shadow:0 8px 24px rgba(37,99,235,.30);
}
.btn-submit:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(37,99,235,.35); }

/* answered count mini indicator */
.answered-count {
    font-size:.78rem; color:var(--muted); font-weight:500;
}
.answered-count span { color:var(--accent); font-weight:700; }

/* ── unanswered shake warning ── */
@keyframes shake {
    0%,100%{ transform:translateX(0); }
    20%    { transform:translateX(-6px); }
    40%    { transform:translateX(6px); }
    60%    { transform:translateX(-4px); }
    80%    { transform:translateX(4px); }
}
.shake { animation:shake .4s ease; }

/* warn unanswered question */
.question-item.warn .question-text { color:#dc2626; }
.question-item.warn .options-row { outline:2px solid rgba(220,38,38,.25); border-radius:12px; padding:4px; }

/* ── animations ── */
@keyframes fadeUp {
    from{ opacity:0; transform:translateY(20px); }
    to  { opacity:1; transform:translateY(0); }
}
@keyframes pulse {
    0%,100%{ opacity:1; transform:scale(1); }
    50%    { opacity:.5; transform:scale(1.4); }
}
@keyframes slideIn {
    from{ opacity:0; transform:translateX(40px); }
    to  { opacity:1; transform:translateX(0); }
}
@keyframes slideOut {
    from{ opacity:1; transform:translateX(0); }
    to  { opacity:0; transform:translateX(-40px); }
}
.slide-in  { animation:slideIn .35s ease both; }
.slide-out { animation:slideOut .25s ease both; }

/* ── completion overlay ── */
.complete-screen {
    display:none;
    position:fixed; inset:0; z-index:200;
    background:rgba(12,19,64,.55);
    backdrop-filter:blur(6px);
    place-items:center;
}
.complete-screen.show { display:grid; }
.complete-box {
    background:white; border-radius:24px;
    padding:2.5rem 2rem; text-align:center;
    max-width:380px; width:90%;
    animation:fadeUp .4s ease;
}
.complete-box .icon { font-size:3rem; margin-bottom:1rem; }
.complete-box h2 {
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:1.5rem; font-weight:800; color:var(--navy); margin-bottom:.5rem;
}
.complete-box p { font-size:.9rem; color:var(--muted); margin-bottom:1.5rem; }
.complete-box .submit-final {
    background:linear-gradient(135deg, var(--accent), #6366f1);
    color:white; border:none; border-radius:99px;
    padding:.75rem 2rem; font-size:.9rem; font-weight:700;
    cursor:pointer; width:100%; font-family:'DM Sans',sans-serif;
    box-shadow:0 8px 24px rgba(37,99,235,.30); transition:.2s;
}
.complete-box .submit-final:hover { transform:translateY(-2px); }

/* mobile tweaks */
@media(max-width:520px){
    .options-row { flex-direction:column; }
    .opt-btn { border-radius:12px; }
}
</style>
</head>

        <input type="radio" name="q2_c" id="q2_c_5" value="5"><input type="radio" name="q2_c" id="q2_c_4" value="4"><input type="radio" name="q2_c" id="q2_c_3" value="3"><input type="radio" name="q2_c" id="q2_c_2" value="2"><input type="radio" name="q2_c" id="q2_c_1" value="1">
        <input type="radio" name="q3_c" id="q3_c_5" value="5"><input type="radio" name="q3_c" id="q3_c_4" value="4"><input type="radio" name="q3_c" id="q3_c_3" value="3"><input type="radio" name="q3_c" id="q3_c_2" value="2"><input type="radio" name="q3_c" id="q3_c_1" value="1">
        <input type="radio" name="q4_c" id="q4_c_5" value="5"><input type="radio" name="q4_c" id="q4_c_4" value="4"><input type="radio" name="q4_c" id="q4_c_3" value="3"><input type="radio" name="q4_c" id="q4_c_2" value="2"><input type="radio" name="q4_c" id="q4_c_1" value="1">
        <input type="radio" name="q5_c" id="q5_c_5" value="5"><input type="radio" name="q5_c" id="q5_c_4" value="4"><input type="radio" name="q5_c" id="q5_c_3" value="3"><input type="radio" name="q5_c" id="q5_c_2" value="2"><input type="radio" name="q5_c" id="q5_c_1" value="1">

        <!-- Visual section rendered by JS -->
        <div id="sectionRenderer"></div>

        <!-- Nav buttons -->
        <div class="nav-buttons" id="navButtons">
            <button type="button" class="btn-prev" id="btnPrev" style="display:none" onclick="changeSection(-1)">
                <i class="fas fa-arrow-left"></i> Previous
            </button>
            <div class="answered-count" id="answeredCount"></div>
            <button type="button" class="btn-next" id="btnNext" onclick="changeSection(1)">
                Next <i class="fas fa-arrow-right"></i>
            </button>
        </div>

    </form>
</div>

<!-- Completion overlay -->
<div class="complete-screen" id="completeScreen">
    <div class="complete-box">
        <div class="icon" style="width:52px;height:52px;background:var(--accent);border-radius:14px;display:grid;place-items:center;margin:0 auto 1rem;"><i class="fas fa-check" style="color:white;font-size:1.3rem;"></i></div>
        <h2>All Done!</h2>
        <p>You've answered all 30 questions. Submit now to see your RIASEC personality profile.</p>
        <button class="submit-final" onclick="document.getElementById('quizForm').submit()">
            <i class="fas fa-paper-plane"></i> Submit
        </button>
    </div>
</div>

<script>
const SECTIONS = [
    {
        key:'r', title:'Realistic', sub:'Hands-on, practical, technical',
        badge:'Section 1 / 6',
        qs:[
            'I enjoy repairing electronic devices or machines.',
            'I enjoy practical lab experiments.',
            'I like working with tools and equipment.',
            'I prefer physical work over theoretical discussions.',
            'I enjoy subjects involving technical drawing or mechanics.'
        ]
    },
    {
        key:'i', title:'Investigative', sub:'Analytical, curious, research-driven',
        badge:'Section 2 / 6',
        qs:[
            'I enjoy solving complex math problems.',
            'I am curious about how things work scientifically.',
            'I am interested in subjects like Physics, Chemistry, or Biology.',
            'I try to find patterns in information.',
            'I enjoy researching new topics.'
        ]
    },
    {
        key:'a', title:'Artistic', sub:'Creative, expressive, imaginative',
        badge:'Section 3 / 6',
        qs:[
            'I like writing stories, poems, or content.',
            'I enjoy music, dance, or drama activities.',
            'I enjoy designing posters or digital content.',
            'I prefer creative projects over structured assignments.',
            'I think of new and unique ideas often.'
        ]
    },
    {
        key:'s', title:'Social', sub:'Helping, teaching, supporting',
        badge:'Section 4 / 6',
        qs:[
            'I enjoy helping others solve problems.',
            'I feel happy when someone understands something because of me.',
            'I prefer group work over working alone.',
            'I enjoy volunteering or social work.',
            'I enjoy counseling or guiding friends.'
        ]
    },
    {
        key:'e', title:'Enterprising', sub:'Leadership, business, persuasion',
        badge:'Section 5 / 6',
        qs:[
            'I enjoy leading a group.',
            'I feel confident speaking in public.',
            'I am interested in business or startups.',
            'I like organizing events or activities.',
            'I enjoy taking risks to achieve success.'
        ]
    },
    {
        key:'c', title:'Conventional', sub:'Organized, structured, detail-oriented',
        badge:'Section 6 / 6',
        qs:[
            'I prefer clear rules and structure.',
            'I follow instructions carefully.',
            'I enjoy planning schedules.',
            'I would prefer stable job environments.',
            'I prefer routine tasks over unpredictable ones.'
        ]
    }
];

const OPTS = [
    {val:'5', label:'Strongly Agree'},
    {val:'4', label:'Agree'},
    {val:'3', label:'Neutral'},
    {val:'2', label:'Disagree'},
    {val:'1', label:'Strongly Disagree'}
];

let current = 0;

function getAnswered(secIdx) {
    const k = SECTIONS[secIdx].key;
    return [1,2,3,4,5].filter(n => {
        const name = `q${n}_${k}`;
        return document.querySelector(`input[name="${name}"]:checked`);
    }).length;
}

function renderSection(idx, dir=1) {
    const sec = SECTIONS[idx];
    const renderer = document.getElementById('sectionRenderer');

    renderer.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'section-card slide-in';

    // header
    let headerHTML = `
        <div class="section-header">
            <div class="section-number">${idx+1}</div>
            <div class="section-info">
                <h2>${sec.title}</h2>
                <p>${sec.sub}</p>
            </div>
            <span class="section-badge">${sec.badge}</span>
        </div>
        <div class="questions-body">
    `;

    sec.qs.forEach((q, qi) => {
        const name = `q${qi+1}_${sec.key}`;
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        const curVal = checked ? checked.value : null;

        headerHTML += `<div class="question-item" data-name="${name}">
            <div class="question-num">Question ${qi+1}</div>
            <div class="question-text">${q}</div>
            <div class="options-row">`;

        OPTS.forEach(o => {
            const sel = curVal === o.val ? 'selected' : '';
            headerHTML += `<button type="button" class="opt-btn ${sel}" data-name="${name}" data-val="${o.val}" onclick="pick(this)">
                <span class="dot"></span>${o.label}
            </button>`;
        });

        headerHTML += `</div></div>`;
    });

    headerHTML += `</div>`;
    card.innerHTML = headerHTML;
    renderer.appendChild(card);

    updateUI();
}

function pick(btn) {
    const name = btn.dataset.name;
    const val  = btn.dataset.val;

    // update visual
    document.querySelectorAll(`.opt-btn[data-name="${name}"]`).forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    // check real hidden radio
    const radio = document.getElementById(`${name}_${val}`);
    if (radio) radio.checked = true;

    // remove warn
    const qItem = btn.closest('.question-item');
    if (qItem) qItem.classList.remove('warn');

    updateUI();

    // auto-advance if last question in section and all answered
    const sec = SECTIONS[current];
    const allDone = [1,2,3,4,5].every(n => document.querySelector(`input[name="q${n}_${sec.key}"]:checked`));
    if (allDone && current < SECTIONS.length - 1) {
        setTimeout(() => changeSection(1), 320);
    } else if (allDone && current === SECTIONS.length - 1) {
        setTimeout(() => document.getElementById('completeScreen').classList.add('show'), 400);
    }
}

function updateUI() {
    // progress
    let total = 0;
    SECTIONS.forEach((s,i) => total += getAnswered(i));
    const pct = Math.round((total / 30) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
    document.getElementById('sectionLabel').textContent =
        `Section ${current+1} of 6 — ${SECTIONS[current].title}`;

    // answered count
    const ans = getAnswered(current);
    document.getElementById('answeredCount').innerHTML =
        `<span>${ans}</span> / 5 answered`;

    // prev btn
    document.getElementById('btnPrev').style.display = current === 0 ? 'none' : 'inline-flex';

    // next/submit btn
    const nextBtn = document.getElementById('btnNext');
    if (current === SECTIONS.length - 1) {
        nextBtn.innerHTML = '<i class="fas fa-check"></i> Finish';
        nextBtn.className = 'btn-submit';
    } else {
        nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
        nextBtn.className = 'btn-next';
    }
}

function changeSection(dir) {
    // validate all 5 answered
    const sec = SECTIONS[current];
    const unanswered = [];
    [1,2,3,4,5].forEach(n => {
        const name = `q${n}_${sec.key}`;
        if (!document.querySelector(`input[name="${name}"]:checked`)) unanswered.push(name);
    });

    if (unanswered.length > 0) {
        unanswered.forEach(name => {
            const item = document.querySelector(`.question-item[data-name="${name}"]`);
            if (item) item.classList.add('warn');
        });
        const card = document.querySelector('.section-card');
        if (card) { card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 500); }
        return;
    }

    if (dir === 1 && current === SECTIONS.length - 1) {
        document.getElementById('completeScreen').classList.add('show');
        return;
    }

    current = Math.max(0, Math.min(SECTIONS.length - 1, current + dir));
    renderSection(current, dir);
    window.scrollTo({top:0, behavior:'smooth'});
}

// init
renderSection(0);
</script>
</body>
</html>
